<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Temporary Thurr Solutions maintenance page for planned site updates."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Thurr Solutions | Maintenance</title>
    <style>
      :root {
        --bg: #10100e;
        --panel: #181815;
        --ink: #f5f1e8;
        --muted: #bcb6aa;
        --dim: #817a6f;
        --line: rgba(245, 241, 232, 0.14);
        --accent: #e8643c;
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(90deg, rgba(232, 100, 60, 0.055) 1px, transparent 1px) 0 0 / 48px 48px,
          linear-gradient(rgba(232, 100, 60, 0.055) 1px, transparent 1px) 0 0 / 48px 48px,
          var(--bg);
        color: var(--ink);
      }

      main {
        width: min(100% - 32px, 920px);
        border: 1px solid var(--line);
        background: rgba(24, 24, 21, 0.92);
        padding: clamp(28px, 6vw, 64px);
      }

      .eyebrow,
      .status,
      a {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 780px;
        margin: 28px 0 22px;
        font-size: clamp(2.8rem, 8vw, 6.6rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      p {
        max-width: 660px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.16rem);
        line-height: 1.7;
      }

      .status-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 40px;
      }

      .status {
        border: 1px solid var(--line);
        padding: 10px 12px;
        color: var(--dim);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      a {
        display: inline-flex;
        width: fit-content;
        margin-top: 34px;
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration-color: var(--accent);
        text-underline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <div class="eyebrow">Thurr Solutions / Maintenance</div>
      <h1 id="page-title">Quick tune-up in progress.</h1>
      <p>
        If you landed here during an update window, the main site is being tuned. For active work,
        direct requests, or consultation follow-up, email Thurr.
      </p>
      <div class="status-row" aria-label="Current site status">
        <span class="status">Maintenance standby</span>
        <span class="status">Updates in progress</span>
        <span class="status">Direct contact open</span>
      </div>
      <a href="mailto:hello@thurrsolutions.com">hello@thurrsolutions.com</a>
    </main>
  </body>
</html>
