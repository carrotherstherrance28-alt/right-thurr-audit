<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Therrance "Thurr" Carrothers | Thurr Solutions</title>
    <meta
      name="description"
      content="Save Thurr's contact and connect with Thurr Solutions."
    />
    <meta name="theme-color" content="#0B0B0D" />
    <style>
      :root {
        --bg: #0b0b0d;
        --panel: #141417;
        --panel-2: #19191d;
        --text: #f7f2ec;
        --muted: #b7aea6;
        --dim: #7f7770;
        --accent: #e8643c;
        --accent-2: #ff9a76;
        --line: rgba(247, 242, 236, 0.13);
        --danger: #ff7d67;
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          var(--bg);
        background-size: 42px 42px;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(100%, 520px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 18px 34px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(20, 20, 23, 0.92);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .top {
        padding: 28px 22px 20px;
        border-bottom: 1px solid var(--line);
      }

      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin-bottom: 22px;
        border: 1px solid rgba(232, 100, 60, 0.6);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        overflow: hidden;
      }

      .mark img {
        display: block;
        width: 42px;
        height: 42px;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 10vw, 50px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .role {
        margin: 16px 0 0;
        color: var(--accent-2);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
      }

      .tagline {
        margin: 12px 0 0;
        color: var(--text);
        font-size: 18px;
        line-height: 1.35;
      }

      .location {
        margin: 10px 0 0;
        color: var(--muted);
        font: 500 13px/1.5 JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .section {
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }

      .section:last-child {
        border-bottom: 0;
      }

      .button-stack {
        display: grid;
        gap: 10px;
      }

      .button {
        display: flex;
        min-height: 54px;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 15px;
        color: var(--text);
        background: var(--panel-2);
        text-decoration: none;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.2;
        transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
      }

      .button:hover,
      .button:focus-visible {
        border-color: rgba(232, 100, 60, 0.9);
        background: #202024;
        outline: none;
      }

      .button:active {
        transform: translateY(1px);
      }

      .button.primary {
        min-height: 60px;
        border-color: transparent;
        color: #160c08;
        background: var(--accent);
        box-shadow: 0 12px 34px rgba(232, 100, 60, 0.22);
      }

      .button.primary:hover,
      .button.primary:focus-visible {
        background: #f2764f;
      }

      .button.todo {
        border-style: dashed;
        color: var(--muted);
      }

      .arrow {
        flex: 0 0 auto;
        color: currentColor;
        font: 700 18px/1 JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 22px;
        line-height: 1.1;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font: 700 12px/1.2 JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace;
        text-transform: uppercase;
      }

      input,
      select {
        width: 100%;
        min-height: 50px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px 14px;
        color: var(--text);
        background: #0f0f12;
        font: 600 16px/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
        outline: 2px solid rgba(232, 100, 60, 0.16);
      }

      .consent {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 2px 0 4px;
        color: var(--muted);
        font: 600 13px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;
        text-transform: none;
      }

      .consent input {
        width: 20px;
        min-width: 20px;
        height: 20px;
        min-height: 20px;
        margin-top: 1px;
        accent-color: var(--accent);
      }

      .submit {
        min-height: 54px;
        border: 0;
        border-radius: 8px;
        color: #160c08;
        background: var(--accent);
        cursor: pointer;
        font-size: 16px;
        font-weight: 900;
      }

      .submit:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .status {
        min-height: 22px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .status.ok {
        color: #8be7b0;
      }

      .status.error {
        color: var(--danger);
      }

      footer {
        padding: 18px 22px 20px;
        color: var(--dim);
        font: 600 12px/1.5 JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .netlify-hidden {
        display: none;
      }

      @media (min-width: 680px) {
        .shell {
          padding-top: 44px;
          padding-bottom: 44px;
        }

        .top,
        .section,
        footer {
          padding-left: 28px;
          padding-right: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <article class="card" aria-label="Thurr Solutions digital business card">
        <header class="top">
          <div class="mark" aria-hidden="true">
            <img src="/card/assets/rt-monogram-clean.png" alt="" />
          </div>
          <h1>Therrance "Thurr" Carrothers</h1>
          <p class="role">AI Automation Architect - Thurr Solutions</p>
          <p class="tagline">I build autonomous revenue systems.</p>
          <p class="location">Houston &middot; St. Louis &middot; Remote.</p>
        </header>

        <section class="section" aria-label="Save contact">
          <a
            class="button primary"
            href="/card/assets/therrance-carrothers.vcf"
            download="Therrance-Carrothers-Thurr-Solutions.vcf"
          >
            <span>Save my contact</span>
            <span class="arrow" aria-hidden="true">+</span>
          </a>
        </section>

        <nav class="section button-stack" aria-label="Thurr links">
          <a class="button" href="https://thurrsolutions.com">
            <span>Website</span>
            <span class="arrow" aria-hidden="true">-&gt;</span>
          </a>
          <a class="button" href="https://calendly.com/thurr">
            <span>Book a consultation</span>
            <span class="arrow" aria-hidden="true">-&gt;</span>
          </a>
          <a class="button" href="https://rightthurr.shop">
            <span>Right Thurr</span>
            <span class="arrow" aria-hidden="true">-&gt;</span>
          </a>
          <a class="button" href="https://www.instagram.com/thurrsolutions/">
            <span>Instagram</span>
            <span class="arrow" aria-hidden="true">-&gt;</span>
          </a>
          <a class="button" href="https://www.linkedin.com/in/therrancecarrothers">
            <span>LinkedIn</span>
            <span class="arrow" aria-hidden="true">-&gt;</span>
          </a>
        </nav>

        <section class="section">
          <h2>Let's connect</h2>
          <form
            id="leadForm"
            name="thurr-card-lead"
            method="POST"
            data-netlify="true"
            netlify-honeypot="bot-field"
          >
            <input type="hidden" name="form-name" value="thurr-card-lead" />
            <p class="netlify-hidden">
              <label>Do not fill this out: <input name="bot-field" /></label>
            </p>
            <input id="timestamp" type="hidden" name="timestamp" value="" />
            <label>
              Name
              <input name="name" autocomplete="name" required />
            </label>
            <label>
              Email
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              Phone
              <input name="phone" type="tel" autocomplete="tel" required />
            </label>
            <label>
              What do you need?
              <select name="need" required>
                <option value="" selected disabled>Select one</option>
                <option>Book a consultation</option>
                <option>Website or Brand</option>
                <option>Lead &amp; Response Automation</option>
                <option>Not sure - just connecting</option>
                <option>Other</option>
              </select>
            </label>
            <label class="consent">
              <input name="consent" type="checkbox" value="true" required />
              <span>I agree to be contacted by Thurr Solutions.</span>
            </label>
            <button class="submit" type="submit">Send</button>
            <div id="formStatus" class="status" role="status" aria-live="polite"></div>
          </form>
        </section>

        <footer>Thurr Solutions LLC &middot; Houston &amp; St. Louis</footer>
      </article>
    </main>

    <script>
      const form = document.querySelector("#leadForm");
      const statusEl = document.querySelector("#formStatus");
      const timestamp = document.querySelector("#timestamp");

      const encode = (data) =>
        new URLSearchParams(data).toString();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusEl.className = "status";
        timestamp.value = new Date().toISOString();

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const button = form.querySelector("button[type='submit']");
        button.disabled = true;
        button.textContent = "Sending...";

        try {
          const response = await fetch("/", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: encode(new FormData(form)),
          });
          if (!response.ok) {
            throw new Error(`Form handler returned ${response.status}`);
          }
          form.reset();
          statusEl.textContent = "Got it - I'll reach out.";
          statusEl.className = "status ok";
        } catch (error) {
          statusEl.textContent =
            "Could not send yet. Check the form handler after deployment.";
          statusEl.className = "status error";
        } finally {
          button.disabled = false;
          button.textContent = "Send";
        }
      });
    </script>
  </body>
</html>
